<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gimilo AI Chat</title>
<style>
  /* استایل‌های پایه و پس‌زمینه طبیعت تصادفی */
  body {
    margin: 0;
    height: 100vh;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    display: flex;
    justify-content: center;
    color: #e2e8f0;
    overflow: hidden;
  }

  /* کلاس تم شیشه‌ای آیفون (Glassmorphism) */
  .glass {
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.3);
  }

  /* کانتینر اصلی */
  .container {
    width: 100%;
    max-width: 850px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center; /* حالت اولیه: مرکز صفحه */
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
    transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  /* حالت چت (پس از ارسال اولین پیام) */
  .container.chatting {
    justify-content: flex-start;
    padding-top: 20px;
    padding-bottom: 30px;
  }

  /* هدر و لوگو */
  .logo-container {
    margin-bottom: 40px;
    transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  .logo-container img {
    height: 140px; /* لوگوی بزرگ در ابتدا */
    object-fit: contain;
    transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
  }

  /* وقتی وارد حالت چت می‌شویم، لوگو کوچک شده و بالا می‌رود */
  .container.chatting .logo-container {
    margin-bottom: 15px;
  }
  .container.chatting .logo-container img {
    height: 50px;
  }

  /* باکس اصلی چت */
  #chatBox {
    width: 100%;
    display: none; /* مخفی در حالت اولیه */
    flex: 1;
    border-radius: 24px;
    padding: 25px;
    overflow-y: auto;
    margin-bottom: 20px;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .container.chatting #chatBox {
    display: flex;
    animation: fadeIn 0.8s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* پیام‌ها */
  .msg { 
    padding: 14px 20px;
    border-radius: 20px;
    line-height: 1.7; 
    white-space: pre-wrap; 
    max-width: 85%;
    font-size: 0.95rem;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  .msg.user { 
    align-self: flex-start; 
    background: rgba(56, 189, 248, 0.25); 
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #f8fafc;
    border-top-right-radius: 4px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .msg.ai { 
    align-self: flex-end; 
    background: rgba(255, 255, 255, 0.12); 
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #f8fafc;
    border-top-left-radius: 4px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  /* انیمیشن در حال فکر کردن (Thinking Indicator) */
  .typing-indicator {
    align-self: flex-end;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 16px 22px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    border-top-left-radius: 4px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    width: fit-content;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  .typing-indicator span {
    width: 8px;
    height: 8px;
    background-color: #cbd5e1;
    border-radius: 50%;
    display: inline-block;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* نوار ورودی */
  .input-bar {
    width: 100%;
    max-width: 800px;
    display: flex;
    align-items: center;
    border-radius: 50px;
    padding: 10px 15px;
    gap: 12px;
    transition: all 0.5s ease;
  }

  /* دکمه میکروفون */
  #micBtn {
    background: transparent;
    border: none;
    color: #cbd5e1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    border-radius: 50%;
    transition: 0.3s;
  }
  #micBtn:hover { color: #fff; background: rgba(255,255,255,0.15); }
  #micBtn.recording { color: #ef4444; animation: pulse 1.5s infinite; }

  @keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
    70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
  }

  /* کادر تایپ */
  #promptInput {
    flex: 1; 
    padding: 10px 5px; 
    border: none;
    font-size: 1.05rem; 
    background: transparent; 
    color: #fff;
    outline: none;
  }
  #promptInput::placeholder {
    color: #94a3b8;
  }

  /* منوی انتخاب مدل (بهبود یافته و زیبا شده) */
  .custom-select-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  
  select {
    appearance: none;
    -webkit-appearance: none;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #e2e8f0;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 10px 15px 10px 35px; /* جای خالی در سمت چپ برای فلش */
    border-radius: 25px;
    outline: none;
    cursor: pointer;
    transition: all 0.3s ease;
    /* فلش سفارشی در سمت چپ برای زبان فارسی (RTL) */
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: left 10px center;
    background-size: 16px;
  }
  
  select:hover { 
    background-color: rgba(255, 255, 255, 0.15); 
    border-color: rgba(255, 255, 255, 0.3);
  }
  select option { background: #1e293b; color: #fff; }

  /* دکمه ارسال (فلش رو به بالا) */
  #sendBtn {
    width: 42px;
    height: 42px;
    border-radius: 50%; 
    border: none;
    background: rgba(255, 255, 255, 0.2); 
    color: #fff; 
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
    flex-shrink: 0;
  }
  #sendBtn:hover { background: rgba(255, 255, 255, 0.35); transform: scale(1.05); }
  #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: scale(1); }

  /* تنظیمات اسکرول‌بار شیشه‌ای */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
</style>
</head>
<body>

<div id="mainContainer" class="container">
  
  <!-- لوگوی جدید شما -->
  <div class="logo-container">
    <img src="https://i.ibb.co/SXhJfXWh/Gemini-Generated-Image-r8jc2dr8jc2dr8jc-removebg-preview.png" alt="Gimilo Logo" id="logo">
  </div>

  <!-- باکس چت (در ابتدا مخفی است) -->
  <div id="chatBox" class="glass"></div>

  <!-- نوار ورودی شیشه‌ای -->
  <div class="input-bar glass">
    
    <!-- دکمه تبدیل صدا به متن (راست) -->
    <button id="micBtn" title="صحبت کنید">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
        <path d="M3.5 6.5A.5.5 0 0 1 4 7v1a4 4 0 0 0 8 0V7a.5.5 0 0 1 1 0v1a5 5 0 0 1-4.5 4.975V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 .5-.5z"/>
        <path d="M10 8a2 2 0 1 1-4 0V3a2 2 0 1 1 4 0v5zM8 0a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V3a3 3 0 0 0-3-3z"/>
      </svg>
    </button>

    <!-- کادر جستجو (وسط) -->
    <input type="text" id="promptInput" placeholder="چه می‌خواهید بدانید؟" autocomplete="off" />
    
    <!-- منوی انتخاب مدل (چپ - با استایل جدید) -->
    <div class="custom-select-wrapper">
      <select id="modelSelect">
        <option value="gemini-3.1-flash-lite">Fast ⚡</option>
        <option value="gemini-3.5-flash">Normal ⚖️</option>
        <option value="gemini-3.7-flash">Pro-level 🧠</option>
        <option value="gemini-3.1-pro">Pro 🔥</option>
      </select>
    </div>

    <!-- دکمه ارسال (چپ‌ترین قسمت) -->
    <button id="sendBtn">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M8 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 .5.5z"/>
      </svg>
    </button>

  </div>

</div>

<script>
  // تولید پس‌زمینه طبیعت تصادفی
  const randomSeed = Math.floor(Math.random() * 100000);
  const imageUrl = `https://picsum.photos/seed/${randomSeed}/1920/1080`;
  document.body.style.backgroundImage = `url(${imageUrl})`;

  // آدرس Worker خود را بگذارید
  const WORKER_URL = "https://gemini-proxy.YOUR-SUBDOMAIN.workers.dev"; 

  const mainContainer = document.getElementById("mainContainer");
  const chatBox = document.getElementById("chatBox");
  const promptInput = document.getElementById("promptInput");
  const modelSelect = document.getElementById("modelSelect");
  const sendBtn = document.getElementById("sendBtn");
  const micBtn = document.getElementById("micBtn");

  // افزودن پیام متنی ساده
  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // افزودن انیمیشن 3 نقطه (در حال تایپ/فکر کردن)
  function showTypingIndicator() {
    const div = document.createElement("div");
    div.className = "typing-indicator";
    div.id = "active-typing";
    div.innerHTML = "<span></span><span></span><span></span>";
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // حذف انیمیشن 3 نقطه
  function hideTypingIndicator() {
    const indicator = document.getElementById("active-typing");
    if (indicator) {
      indicator.remove();
    }
  }

  async function sendMessage() {
    const prompt = promptInput.value.trim();
    const selectedModel = modelSelect.value;
    if (!prompt) return;

    // تغییر حالت به چت در اولین پیام
    if (!mainContainer.classList.contains("chatting")) {
      mainContainer.classList.add("chatting");
    }

    // پیام کاربر را نمایش بده
    addMessage(prompt, "user");
    promptInput.value = "";
    sendBtn.disabled = true;
    
    // انیمیشن فکر کردن را نشان بده
    showTypingIndicator();

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          prompt: prompt,
          model: selectedModel
        })
      });

      if (!response.ok) {
        throw new Error("خطا در ارتباط با سرور: " + response.status);
      }

      const data = await response.json();
      const aiText = data?.candidates?.[0]?.content?.parts?.[0]?.text || data?.error?.message || "پاسخی دریافت نشد.";

      hideTypingIndicator();
      addMessage(aiText, "ai");
    } catch (err) {
      hideTypingIndicator();
      addMessage("خطا: " + err.message, "ai");
    } finally {
      sendBtn.disabled = false;
      promptInput.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  promptInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  // قابلیت تبدیل صدا به متن (Speech to Text)
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  
  if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.lang = 'fa-IR';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    micBtn.addEventListener('click', () => {
      recognition.start();
    });

    recognition.onstart = () => {
      micBtn.classList.add('recording');
      promptInput.placeholder = "در حال شنیدن صدای شما...";
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      promptInput.value = (promptInput.value + " " + transcript).trim();
    };

    recognition.onspeechend = () => {
      recognition.stop();
    };

    recognition.onend = () => {
      micBtn.classList.remove('recording');
      promptInput.placeholder = "چه می‌خواهید بدانید؟";
    };

    recognition.onerror = (event) => {
      micBtn.classList.remove('recording');
      promptInput.placeholder = "چه می‌خواهید بدانید؟";
      alert("خطا در دریافت صدا. لطفاً دسترسی به میکروفون را بررسی کنید.");
    };
  } else {
    micBtn.style.display = 'none';
  }
</script>

</body>
</html>
