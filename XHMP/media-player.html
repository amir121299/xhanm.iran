<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XH-MP | مدیا پلیر حرفه‌ای</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 25px;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #0284c7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* بخش دریافت لینک فوق‌العاده مدرن */
        .input-box {
            display: flex;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            margin-bottom: 25px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            direction: ltr;
        }

        .input-box input::placeholder {
            color: #94a3b8;
            text-align: right;
        }

        .input-box button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .input-box button:hover {
            background: #0369a1;
            transform: translateY(-1px);
        }

        /* باکس پلیر */
        .wrapper {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: #000;
        }

        /* شخصی‌سازی رنگ اصلی پلیر Plyr به آبی جذاب */
        :root {
            --plyr-color-main: #0284c7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مدیا پلیر هوشمند XH-MP</h1>

        <div class="input-box">
            <input type="text" id="video-url" placeholder="لینک مستقیم ویدیو یا پخش زنده (MP4, MKV, m3u8) را وارد کنید...">
            <button id="load-btn">بارگذاری و پخش</button>
        </div>

        <div class="wrapper">
            <video id="player" playsinline controls data-poster="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1964&auto=format&fit=crop">
                <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4" />
            </video>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        const videoElement = document.getElementById('player');
        const urlInput = document.getElementById('video-url');
        const loadBtn = document.getElementById('load-btn');
        
        // راه‌اندازی اولیه پلیر آماده با تمام قابلیت‌ها
        let player = new Plyr(videoElement, {
            controls: ['play-large', 'restart', 'rewind', 'play', 'fast-forward', 'progress', 'current-time', 'duration', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
            settings: ['captions', 'quality', 'speed', 'loop'],
            speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
        });

        let hlsInstance = null;

        // تابع هوشمند برای بارگذاری انواع فرمت‌ها و لینک‌ها
        function loadVideo(url) {
            if (!url) return;

            // اگر موتور HLS از قبل فعال بوده، اول آن را پاک میکنیم
            if (hlsInstance) {
                hlsInstance.destroy();
            }

            // تشخیص اینکه آیا لینک فرمت پخش زنده یا m3u8 است
            if (url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(url);
                    hlsInstance.attachMedia(videoElement);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                        player.play();
                    });
                } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                    // برای مرورگرهای اپل (سافاری) که پیش‌فرض m3u8 بلدند
                    videoElement.src = url;
                    player.play();
                }
            } else {
                // برای فرمت‌های عادی مثل MP4, MKV, WebM
                videoElement.src = url;
                player.play();
            }
        }

        // دکمه کلیک برای بارگذاری لینک جدید امیر
        loadBtn.addEventListener('click', () => {
            const newUrl = urlInput.value.trim();
            loadVideo(newUrl);
        });

        // امکان زدن کلید اینتر به جای کلیک روی دکمه
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadVideo(urlInput.value.trim());
            }
        });
    </script>
</body>
</html>
