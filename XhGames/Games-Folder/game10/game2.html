<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>بازی دوز تک نفره با ربات</title>
<style>
  body {
    background: #222;
    color: white;
    font-family: Tahoma, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    user-select: none;
  }
  h1 {
    margin-bottom: 10px;
  }
  .scores {
    display: flex;
    gap: 30px;
    margin-bottom: 20px;
    font-size: 20px;
  }
  .score-box {
    padding: 10px 20px;
    background: #333;
    border-radius: 8px;
    text-align: center;
  }
  .score-number {
    font-size: 24px;
    font-weight: bold;
    color: #0ff;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 5px;
  }
  .cell {
    background: #333;
    border: 2px solid #0ff;
    font-size: 64px;
    color: #0ff;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: background 0.3s;
  }
  .cell:hover {
    background: #0ff1;
  }
  #status {
    margin-top: 20px;
    font-size: 22px;
  }
  #resetBtn {
    margin-top: 15px;
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #0ff;
    color: #222;
    transition: background 0.3s;
  }
  #resetBtn:hover {
    background: #0cc;
  }
</style>
</head>
<body>

<h1>بازی دوز تک نفره با ربات</h1>

<div class="scores">
  <div class="score-box">
    شما (X): <span id="playerScore" class="score-number">0</span>
  </div>
  <div class="score-box">
    ربات (O): <span id="aiScore" class="score-number">0</span>
  </div>
</div>

<div id="board">
  <div class="cell" data-index="0"></div>
  <div class="cell" data-index="1"></div>
  <div class="cell" data-index="2"></div>
  <div class="cell" data-index="3"></div>
  <div class="cell" data-index="4"></div>
  <div class="cell" data-index="5"></div>
  <div class="cell" data-index="6"></div>
  <div class="cell" data-index="7"></div>
  <div class="cell" data-index="8"></div>
</div>

<div id="status">نوبت شما (X)</div>
<button id="resetBtn">شروع مجدد</button>

<script>
  const board = document.getElementById('board');
  const cells = document.querySelectorAll('.cell');
  const status = document.getElementById('status');
  const resetBtn = document.getElementById('resetBtn');
  const playerScoreElement = document.getElementById('playerScore');
  const aiScoreElement = document.getElementById('aiScore');

  let gameActive = true;
  let gameState = ['', '', '', '', '', '', '', '', ''];
  let playerScore = 0;
  let aiScore = 0;

  const humanPlayer = 'X';
  const aiPlayer = 'O';

  const winningConditions = [
    [0,1,2], [3,4,5], [6,7,8],
    [0,3,6], [1,4,7], [2,5,8],
    [0,4,8], [2,4,6]
  ];

  function handleCellClick(e) {
    const clickedCell = e.target;
    const clickedIndex = parseInt(clickedCell.getAttribute('data-index'));

    if (gameState[clickedIndex] !== '' || !gameActive) {
      return;
    }

    playerMove(clickedCell, clickedIndex);
    if (gameActive) {
      setTimeout(aiMove, 500);
    }
  }

  function playerMove(cell, index) {
    gameState[index] = humanPlayer;
    cell.textContent = humanPlayer;
    checkResult(humanPlayer);
    if (gameActive) {
      status.textContent = 'نوبت ربات (O)';
    }
  }

  // الگوریتم Minimax برای ربات باهوش
  function minimax(board, depth, isMaximizing) {
    const winner = checkWinner();
    if (winner === aiPlayer) return 10 - depth;
    if (winner === humanPlayer) return depth - 10;
    if (isBoardFull()) return 0;

    if (isMaximizing) {
      let bestScore = -Infinity;
      for (let i = 0; i < board.length; i++) {
        if (board[i] === '') {
          board[i] = aiPlayer;
          let score = minimax(board, depth + 1, false);
          board[i] = '';
          bestScore = Math.max(score, bestScore);
        }
      }
      return bestScore;
    } else {
      let bestScore = Infinity;
      for (let i = 0; i < board.length; i++) {
        if (board[i] === '') {
          board[i] = humanPlayer;
          let score = minimax(board, depth + 1, true);
          board[i] = '';
          bestScore = Math.min(score, bestScore);
        }
      }
      return bestScore;
    }
  }

  function aiMove() {
    let bestScore = -Infinity;
    let move;
    for (let i = 0; i < gameState.length; i++) {
      if (gameState[i] === '') {
        gameState[i] = aiPlayer;
        let score = minimax(gameState, 0, false);
        gameState[i] = '';
        if (score > bestScore) {
          bestScore = score;
          move = i;
        }
      }
    }

    if (move !== undefined) {
      gameState[move] = aiPlayer;
      cells[move].textContent = aiPlayer;
      checkResult(aiPlayer);

      if (gameActive) {
        status.textContent = 'نوبت شما (X)';
      }
    }
  }

  function checkWinner() {
    for (let condition of winningConditions) {
      const [a, b, c] = condition;
      if (
        gameState[a] &&
        gameState[a] === gameState[b] &&
        gameState[a] === gameState[c]
      ) {
        return gameState[a];
      }
    }
    return null;
  }

  function isBoardFull() {
    return !gameState.includes('');
  }

  function updateScores(winner) {
    if (winner === humanPlayer) {
      playerScore++;
      playerScoreElement.textContent = playerScore;
    } else if (winner === aiPlayer) {
      aiScore++;
      aiScoreElement.textContent = aiScore;
    }
  }

  function checkResult(player) {
    const winner = checkWinner();

    if (winner) {
      status.textContent = winner === humanPlayer ? 'شما برنده شدید! 🎉' : 'ربات برنده شد! 🤖';
      updateScores(winner);
      gameActive = false;
      return;
    }

    if (isBoardFull()) {
      status.textContent = 'بازی مساوی شد! 😐';
      gameActive = false;
    }
  }

  function resetGame() {
    gameActive = true;
    gameState = ['', '', '', '', '', '', '', '', ''];
    cells.forEach(cell => (cell.textContent = ''));
    status.textContent = 'نوبت شما (X)';
  }

  cells.forEach(cell => cell.addEventListener('click', handleCellClick));
  resetBtn.addEventListener('click', resetGame);
</script>

</body>
</html>
