<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Xh GitGames</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      background: #0a051b;
      background: linear-gradient(135deg, #050112 0%, #0d0826 50%, #1a0b36 100%);
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* بهینه‌سازی کانتینر ذرات برای رندر سریع‌تر */
    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none; /* برای عدم تداخل با کلیک دکمه‌ها */
    }

    .menu-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 1000px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 4rem;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 50px;
      text-shadow: 0 0 10px rgba(0, 238, 255, 0.5), 0 0 30px rgba(0, 238, 255, 0.3);
      background: linear-gradient(to right, #fff 20%, #00eeff 50%, #fff 80%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
      width: 100%;
    }

    /* طراحی استایل نئون-شیشه‌ای مدرن (Glassmorphism) */
    .btn {
      position: relative;
      padding: 22px;
      font-size: 1.3rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      cursor: pointer;
      text-decoration: none;
      display: block;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      overflow: hidden;
    }

    /* خط درخشان دور دکمه هنگام هاور */
    .btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 16px;
      padding: 2px;
      background: linear-gradient(45deg, #00eeff, #ff0077);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(0, 238, 255, 0.2);
    }

    .btn:hover::before {
      opacity: 1;
    }

    /* دکمه اختصاصی عمو امیر با افکت نئون بنفش و صورتی متمایز */
    .special-btn {
      background: rgba(255, 0, 128, 0.05);
      border: 1px solid rgba(255, 0, 128, 0.2);
      box-shadow: 0 8px 32px 0 rgba(255, 0, 128, 0.1);
    }

    .special-btn::before {
      background: linear-gradient(45deg, #ff0077, #7000ff);
    }

    .special-btn:hover {
      background: rgba(255, 0, 128, 0.15);
      box-shadow: 0 12px 35px rgba(255, 0, 128, 0.4);
    }

    /* انیمیشن شناور بهینه‌شده گروهی برای جلوگیری از لگ */
    .buttons {
      animation: floatContainer 5s ease-in-out infinite;
    }

    @keyframes floatContainer {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* ریسپانسیو فوق‌العاده برای گوشی */
    @media (max-width: 600px) {
      h1 { font-size: 2.5rem; margin-bottom: 30px; }
      .btn { padding: 16px; font-size: 1.1rem; }
      .buttons { gap: 15px; }
    }
  </style>
</head>
<body>

<div id="particles-js"></div>

<div class="menu-container">
  <h1>Xh GitGames</h1>
  <div class="buttons">
    <a href="XMO+/index.html" class="btn">XMO+</a>
    <a href="PingPong/index.html" class="btn">PingPong</a>
    <a href="MemoryGame/index.html" class="btn">MemoryGame</a>
    <a href="ZombieGame/index.html" class="btn">ZombieGame</a>
    <a href="js-racing-main/index.html" class="btn">js-racing-main</a>
    <a href="forrip/index.html" class="btn special-btn">For Amo Amir</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
  // بهینه‌سازی تعداد ذرات پارتیکل برای افزایش چشمگیر سرعت لود و فریم‌ریت صفحه
  particlesJS('particles-js', {
    "particles": {
      "number": {"value": 50, "density": {"enable": true, "value_area": 800}},
      "color": {"value": "#00eeff"},
      "shape": {"type": "circle"},
      "opacity": {"value": 0.3, "random": true},
      "size": {"value": 2, "random": true},
      "line_linked": {
        "enable": true,
        "distance": 130,
        "color": "#00eeff",
        "opacity": 0.2,
        "width": 1
      },
      "move": {
        "enable": true,
        "speed": 1.5,
        "direction": "none",
        "random": true,
        "straight": false,
        "out_mode": "out",
        "bounce": false
      }
    },
    "interactivity": {
      "detect_on": "window",
      "events": {
        "onhover": {"enable": true, "mode": "grab"},
        "onclick": {"enable": true, "mode": "push"},
        "resize": true
      },
      "modes": {
        "grab": { "distance": 140, "line_linked": { "opacity": 0.5 } }
      }
    }
  });
</script>

</body>
</html>
