<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ماشین حساب پیشرفته</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    direction: rtl;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background: #090615;
    background: radial-gradient(circle at center, #161033 0%, #07040d 100%);
    color: #f1f1f1;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 30px;
    padding: 20px;
  }

  /* استایل شیشه‌ای نئون برای بدنه اصلی */
  .calculator, .history {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    padding: 24px;
    width: 350px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 
                0 0 20px rgba(0, 173, 181, 0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .calculator:hover, .history:hover {
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 
                0 0 30px rgba(0, 173, 181, 0.2);
  }

  /* صفحه نمایشگر مدرن و عمیق */
  .display {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.05);
    height: 75px;
    border-radius: 16px;
    font-size: 2.4rem;
    font-weight: 600;
    padding: 15px 20px;
    margin-bottom: 20px;
    overflow-x: auto;
    overflow-y: hidden;
    user-select: none;
    white-space: nowrap;
    text-align: left;
    direction: ltr;
    color: #00fff2;
    text-shadow: 0 0 10px rgba(0, 255, 242, 0.3);
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }

  /* اسکرول بار باریک برای نمایشگر */
  .display::-webkit-scrollbar {
    height: 4px;
  }
  .display::-webkit-scrollbar-thumb {
    background: rgba(0, 255, 242, 0.3);
    border-radius: 2px;
  }

  .buttons {
    direction: ltr;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  /* استایل پایه دکمه‌ها */
  button {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 14px;
    padding: 16px;
    font-size: 1.4rem;
    font-weight: 500;
    color: #e0e0e0;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    user-select: none;
  }

  /* دکمه‌های اعداد */
  button[data-number] {
    background: rgba(255, 255, 255, 0.08);
  }
  button[data-number]:hover {
    background: rgba(255, 255, 255, 0.18);
    color: #fff;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
  }

  /* دکمه‌های عملگر اصلی ریاضی */
  button.operator, button[data-action="+"], button[data-action="−"], button[data-action="×"], button[data-action="÷"] {
    background: rgba(0, 173, 181, 0.12);
    border: 1px solid rgba(0, 173, 181, 0.2);
    color: #00adb5;
  }
  
  button.operator:hover, button[data-action="+"]:hover, button[data-action="−"]:hover, button[data-action="×"]:hover, button[data-action="÷"]:hover {
    background: #00adb5;
    color: #090615;
    box-shadow: 0 0 20px rgba(0, 173, 181, 0.4);
  }

  /* کلیدهای خاص سی و پاک کردن حافظه */
  button[data-action="clear"], button[data-action="backspace"] {
    background: rgba(255, 7, 110, 0.1);
    border: 1px solid rgba(255, 7, 110, 0.2);
    color: #ff076e;
  }
  button[data-action="clear"]:hover, button[data-action="backspace"]:hover {
    background: #ff076e;
    color: #fff;
    box-shadow: 0 0 20px rgba(255, 7, 110, 0.4);
  }

  /* دکمه مساوی حماسی */
  button[data-action="="] {
    grid-column: span 4;
    background: linear-gradient(45deg, #ff5722, #ff7849);
    border: none;
    font-weight: bold;
    color: white;
    box-shadow: 0 4px 15px rgba(255, 87, 34, 0.3);
  }

  button[data-action="="]:hover {
    background: linear-gradient(45deg, #e64a19, #ff5722);
    box-shadow: 0 6px 25px rgba(255, 87, 34, 0.5);
    transform: translateY(-2px);
  }

  button:active {
    transform: scale(0.95);
  }

  /* دکمه درباره */
  .about-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    margin-top: 15px;
    width: 100%;
    font-weight: 600;
    border-radius: 14px;
    padding: 14px;
    font-size: 1.1rem;
    color: #aaa;
    transition: all 0.3s;
  }

  .about-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
  }

  /* لیست تاریخچه */
  .history {
    max-height: 485px;
    display: flex;
    flex-direction: column;
  }

  .history h2 {
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding-bottom: 10px;
    color: #00adb5;
  }

  .history-list {
    list-style: none;
    overflow-y: auto;
    flex-grow: 1;
    padding-left: 5px;
  }

  .history-list::-webkit-scrollbar {
    width: 6px;
  }
  .history-list::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
  }

  .history-list li {
    padding: 12px;
    border-radius: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 6px;
    transition: all 0.2s;
    direction: ltr;
    text-align: left;
    background: rgba(0, 0, 0, 0.15);
  }

  .history-list li:hover {
    background: rgba(0, 173, 181, 0.15);
    color: #00fff2;
    transform: translateX(3px);
  }

  /* پنجره مودال پاپ‌آپ */
  .modal {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0; top: 0;
    width: 100vw; height: 100vh;
    background: rgba(5, 3, 10, 0.85);
    backdrop-filter: blur(10px);
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background: #120e24;
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 35px;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
    max-width: 400px;
    width: 90%;
    text-align: center;
    animation: modalGlow 0.4s ease;
  }

  @keyframes modalGlow {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-content h3 {
    margin-bottom: 20px;
    font-size: 1.8rem;
    color: #ff5722;
  }

  .modal-content p {
    line-height: 1.8;
    color: #ccc;
    font-size: 1.05rem;
  }

  .close-btn {
    margin-top: 25px;
    padding: 12px 30px;
    background: #ff5722;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    color: white;
    transition: all 0.2s;
  }

  .close-btn:hover {
    background: #e64a19;
    box-shadow: 0 0 15px rgba(255, 87, 34, 0.4);
  }
</style>
</head>
<body>

<div class="calculator" role="region" aria-label="ماشین حساب">
  <div id="display" class="display" aria-live="polite" aria-atomic="true">0</div>
  <div class="buttons" role="group" aria-label="دکمه‌های ماشین حساب">
    <button class="operator" data-action="clear" aria-label="پاک کردن همه">C</button>
    <button class="operator" data-action="backspace" aria-label="حذف آخرین">⌫</button>
    <button class="operator" data-action="(" aria-label="پرانتز باز">(</button>
    <button class="operator" data-action=")" aria-label="پرانتز بسته">)</button>

    <button data-number="7">7</button>
    <button data-number="8">8</button>
    <button data-number="9">9</button>
    <button data-action="÷">÷</button>

    <button data-number="4">4</button>
    <button data-number="5">5</button>
    <button data-number="6">6</button>
    <button data-action="×">×</button>

    <button data-number="1">1</button>
    <button data-number="2">2</button>
    <button data-number="3">3</button>
    <button data-action="−">−</button>

    <button data-number="0" style="grid-column: span 2;">0</button>
    <button data-number=".">.</button>
    <button data-action="+">+</button>

    <button data-action="=">=</button>
  </div>
  <button class="about-btn" id="aboutBtn" aria-label="درباره">درباره سازنده</button>
</div>

<div class="history" role="region" aria-label="تاریخچه محاسبات">
  <h2>تاریخچه محاسبات</h2>
  <ul id="historyList" class="history-list" tabindex="0"></ul>
</div>

<div id="aboutModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle" aria-describedby="aboutDesc">
  <div class="modal-content">
    <h3 id="aboutTitle">درباره سازنده</h3>
    <p id="aboutDesc"><strong>نام و نام خانوادگی:</strong> امیر حسین بیانی مقدم<br/>
    <strong>ایمیل پشتیبانی:</strong> xhanmceo@gmail.com</p>
    <button class="close-btn" id="closeModal" aria-label="بستن پنجره درباره">بستن پنجره</button>
  </div>
</div>

<script>
  const display = document.getElementById('display');
  const historyList = document.getElementById('historyList');
  const aboutBtn = document.getElementById('aboutBtn');
  const aboutModal = document.getElementById('aboutModal');
  const closeModal = document.getElementById('closeModal');

  let currentInput = '';
  let history = [];

  function loadHistory() {
    const saved = localStorage.getItem('calcHistory');
    if (saved) {
      try {
        history = JSON.parse(saved);
        renderHistory();
      } catch(e) {
        history = [];
      }
    }
  }

  function saveHistory() {
    localStorage.setItem('calcHistory', JSON.stringify(history));
  }

  function addHistory(expression, result) {
    history.unshift({expression, result});
    if (history.length > 20) {
      history.pop();
    }
    saveHistory();
    renderHistory();
  }

  function renderHistory() {
    historyList.innerHTML = '';
    history.forEach(item => {
      const li = document.createElement('li');
      li.textContent = `${item.expression} = ${item.result}`;
      li.title = "برای استفاده مجدد کلیک کنید";
      li.tabIndex = 0;
      li.addEventListener('click', () => {
        currentInput = item.result.toString();
        updateDisplay();
      });
      li.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          li.click();
        }
      });
      historyList.appendChild(li);
    });
  }

  function updateDisplay() {
    display.textContent = currentInput || '0';
    // اسکرول اتوماتیک به سمت راست به هنگام طولانی شدن عدد ورودی
    display.scrollLeft = display.scrollWidth;
  }

  function calculate(expr) {
    let jsExpr = expr.replace(/÷/g, '/').replace(/×/g, '*').replace(/−/g, '-');
    try {
      const result = Function('"use strict";return (' + jsExpr + ')')();
      if (typeof result === 'number' && !isNaN(result) && isFinite(result)) {
        // گرد کردن اعشارهای خیلی طولانی برای تمیزتر شدن خروجی
        return Number(result.toFixed(8).replace(/\.?0+$/, ''));
      } else {
        return null;
      }
    } catch {
      return null;
    }
  }

  function clearInput() {
    currentInput = '';
    updateDisplay();
  }

  function backspaceInput() {
    currentInput = currentInput.slice(0, -1);
    updateDisplay();
  }

  document.querySelectorAll('.buttons button').forEach(button => {
    button.addEventListener('click', () => {
      const action = button.dataset.action;
      const number = button.dataset.number;

      if (number !== undefined) {
        currentInput += number;
        updateDisplay();
      } else if (action !== undefined) {
        switch(action) {
          case 'clear':
            clearInput();
            break;
          case 'backspace':
            backspaceInput();
            break;
          case '=':
            if (currentInput.trim() === '') return;
            const result = calculate(currentInput);
            if (result !== null) {
              addHistory(currentInput, result);
              currentInput = result.toString();
              updateDisplay();
            } else {
              alert('عبارت وارد شده معتبر نیست!');
            }
            break;
          default:
            currentInput += action;
            updateDisplay();
        }
      }
    });
  });

  aboutBtn.addEventListener('click', () => {
    aboutModal.style.display = 'flex';
  });

  closeModal.addEventListener('click', () => {
    aboutModal.style.display = 'none';
  });

  window.addEventListener('click', e => {
    if (e.target === aboutModal) {
      aboutModal.style.display = 'none';
    }
  });

  loadHistory();
  updateDisplay();
</script>

</body>
</html>
