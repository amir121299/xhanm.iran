<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XH-ANM</title>
  <link rel="icon" href="Untitled.png" type="image/png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&family=Orbitron:wght@700;900&display=swap');

    :root {
      --primary: #00ffcc;
      --secondary: #0077ff;
      --neon-pink: #ff007f;
      --bg-dark: #06060c;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(0, 255, 204, 0.15);
      --text-color: #ffffff;
    }

    body.light-mode {
      --bg-dark: #f0f4f8;
      --card-bg: rgba(0, 0, 0, 0.04);
      --card-border: rgba(0, 119, 255, 0.2);
      --text-color: #1a1a2e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-color);
      font-family: 'Vazirmatn', sans-serif;
      direction: rtl;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.5s ease, color 0.5s ease;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      display: block;
    }

    .theme-switcher {
      position: absolute;
      top: 25px;
      left: 25px;
      z-index: 100;
    }

    .theme-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-color);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }
    .theme-btn:hover {
      transform: scale(1.1);
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary);
    }

    #super-wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 100px 20px 40px 20px;
      perspective: 500px;
    }

    .blue-glow-text {
      font-size: clamp(48px, 9vw, 92px);
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      letter-spacing: 6px;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--neon-pink), var(--primary));
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      direction: ltr;
      filter: drop-shadow(0 0 25px rgba(0, 255, 204, 0.5));
      animation: sweep 6s linear infinite;
      will-change: transform;
    }

    @keyframes sweep {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      max-width: 1100px;
      margin: 20px auto;
      padding: 20px;
      width: 92%;
    }

    nav a {
      text-decoration: none;
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      color: var(--text-color);
      padding: 25px 15px;
      border-radius: 20px;
      font-weight: 700;
      text-align: center;
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 85px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      opacity: 0;
      transform: scale(0.6);
      animation: buttonIntro 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transition: border 0.3s, box-shadow 0.3s, color 0.3s, transform 0.2s ease;
    }

    @keyframes buttonIntro {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    nav a:nth-child(1) { animation-delay: 0.1s; }
    nav a:nth-child(2) { animation-delay: 0.18s; }
    nav a:nth-child(3) { animation-delay: 0.26s; }
    nav a:nth-child(4) { animation-delay: 0.34s; }
    nav a:nth-child(5) { animation-delay: 0.42s; }
    nav a:nth-child(6) { animation-delay: 0.5s; }
    nav a:nth-child(7) { animation-delay: 0.58s; }
    nav a:nth-child(8) { animation-delay: 0.66s; }

    nav a:hover {
      border-color: var(--primary);
      box-shadow: 0 10px 25px rgba(0, 255, 204, 0.35);
      color: var(--primary);
      transform: translateY(-5px);
    }

    body.light-mode nav a:hover {
      border-color: var(--secondary);
      box-shadow: 0 10px 25px rgba(0, 119, 255, 0.25);
      color: var(--secondary);
    }

    .language-switcher {
      position: relative;
      display: inline-flex;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px;
      border-radius: 30px;
      margin: 40px auto;
      width: fit-content;
      align-self: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      direction: ltr !important;
    }

    .slider-bg {
      position: absolute;
      top: 4px;
      left: 4px;
      height: calc(100% - 8px);
      width: calc(50% - 4px);
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 25px;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 1;
      box-shadow: 0 2px 10px rgba(0, 255, 204, 0.3);
      transform: translateX(100%);
    }

    body:not(.english) .slider-bg {
      transform: translateX(0%);
    }

    .lang-btn {
      position: relative;
      background: transparent;
      border: none;
      color: var(--text-color);
      padding: 10px 32px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 700;
      font-family: inherit;
      z-index: 2;
      transition: color 0.3s ease;
    }

    .lang-btn.active {
      color: #000000 !important;
    }

    footer {
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      color: #666;
      text-align: center;
      padding: 25px;
      margin-top: auto;
      font-size: 13px;
      border-top: 1px solid var(--card-border);
      letter-spacing: 1px;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .modal.show { display: flex; opacity: 1; }

    .modal-content {
      background: var(--bg-dark);
      border: 2px solid var(--primary);
      padding: 45px 30px;
      border-radius: 30px;
      width: 88%;
      max-width: 440px;
      box-shadow: 0 0 40px rgba(0, 255, 204, 0.2);
      color: var(--text-color);
      text-align: center;
      transform: scale(0.7);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .modal.show .modal-content { transform: scale(1); }
    .modal-content p { margin: 15px 0; font-size: 18px; line-height: 1.6; }
    .modal-content a { color: var(--primary); text-decoration: none; border-bottom: 1px dashed var(--primary); }
    .close-btn { position: absolute; top: 15px; right: 22px; font-size: 32px; color: #666; cursor: pointer; }
    .close-btn:hover { color: var(--neon-pink); }

    .english * { font-family: 'Orbitron', sans-serif !important; }
  </style>
</head>
<body class="english">

  <canvas id="bg-canvas"></canvas>

  <div class="theme-switcher">
    <button class="theme-btn" id="theme-toggle-btn" onclick="toggleTheme()">🌙</button>
  </div>

  <div id="super-wrapper">

    <header>
      <h1 class="blue-glow-text" id="site-title">XH-ANM</h1>
    </header>

    <nav id="menu">
      <a href="XHMP/media-player.html" target="_blank">Media-Player2</a>
      <a href="XHCal/Calculator.html" target="_blank">Calculator</a>
      <a href="XhGames/Games.html" target="_blank">Game Game</a>
      <a href="signal/index.html" target="_blank">Signal</a>
      <a href="XH OS/index.html" target="_blank">XH OS 2027</a>
      <a href="GitGames/index.html" target="_blank">XH GitGames</a>
      <a href="https://reymit.ir/xhanmceosupport12" target="_blank">Support Me</a>
      <a href="#" id="about-btn">📧 About Me</a>
    </nav>

    <div class="language-switcher">
      <div class="slider-bg"></div>
      <button class="lang-btn" id="btn-fa" onclick="switchLang('fa')">FA</button>
      <button class="lang-btn active" id="btn-en" onclick="switchLang('en')">EN</button>
    </div>

    <footer id="footer-text">
      © 2026 Created by XH-ANM | All rights reserved
    </footer>

  </div>

  <div id="about-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="close-modal">&times;</span>
      <div id="modal-text-container">
        <p>Name: User</p>
        <p>Support Email: <a href="mailto:xhanmceo@gmail.com">xhanmceo@gmail.com</a></p>
        <p>Founder of XH with over 215 active projects.</p>
      </div>
    </div>
  </div>

  <script>
    // --- ۱. سیستم تم لایت مود و نایت مود ---
    let isLightMode = false;
    function toggleTheme() {
      isLightMode = !isLightMode;
      const body = document.body;
      const btn = document.getElementById('theme-toggle-btn');
      
      if(isLightMode) {
        body.classList.add('light-mode');
        btn.innerText = '☀️';
      } else {
        body.classList.remove('light-mode');
        btn.innerText = '🌙';
      }
    }

    // --- ۲. موتور پس‌زمینه روان ذرات کهکشانی ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, isTrail = false) {
        this.x = x || Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = isTrail ? Math.random() * 3 + 1.5 : Math.random() * 1.5 + 0.6;
        this.speedX = isTrail ? Math.random() * 1.6 - 0.8 : Math.random() * 0.4 - 0.2;
        this.speedY = isTrail ? Math.random() * 1.6 - 0.8 : Math.random() * 0.4 - 0.2;
        this.alpha = 1;
        this.isTrail = isTrail;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.isTrail) {
          this.alpha -= 0.02; 
        } else {
          if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
          if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.isTrail ? Math.max(0, this.alpha) : 0.35;
        ctx.fillStyle = isLightMode ? 'rgba(0, 80, 255, 1)' : 'rgba(0, 255, 204, 1)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 50; i++) { particles.push(new Particle()); }

    function spawnTrail(x, y) {
      for(let i=0; i<2; i++) { particles.push(new Particle(x, y, true)); }
    }
    window.addEventListener('mousemove', (e) => { spawnTrail(e.clientX, e.clientY); });
    window.addEventListener('touchmove', (e) => { spawnTrail(e.touches[0].clientX, e.touches[0].clientY); });

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => !p.isTrail || p.alpha > 0);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();

    // --- ۳. مدیریت مودال درباره من ---
    const aboutBtn = document.getElementById('about-btn');
    const aboutModal = document.getElementById('about-modal');
    const closeModal = document.getElementById('close-modal');

    aboutBtn.addEventListener('click', (e) => {
      e.preventDefault();
      aboutModal.style.display = 'flex';
      setTimeout(() => aboutModal.classList.add('show'), 10);
    });

    function hideModal() {
      aboutModal.classList.remove('show');
      setTimeout(() => aboutModal.style.display = 'none', 400);
    }

    closeModal.addEventListener('click', hideModal);
    window.addEventListener('click', (e) => { if (e.target === aboutModal) hideModal(); });

    // --- ۴. مدیریت سوییچر زبان بدون باگ ---
    function switchLang(lang) {
      const btnFa = document.getElementById('btn-fa');
      const btnEn = document.getElementById('btn-en');
      const container = document.getElementById('modal-text-container');
      const links = document.querySelectorAll('#menu a');

      if (lang === 'en') {
        document.body.classList.add("english");
        document.body.style.direction = 'ltr';
        btnEn.classList.add('active');
        btnFa.classList.remove('active');
        
        links[0].innerText = 'Media-Player2';
        links[1].innerText = 'Calculator';
        links[2].innerText = 'Game Game';
        links[3].innerText = 'Signal';
        links[4].innerText = 'XH OS 2027';
        links[5].innerText = 'XH GitGames';
        links[6].innerText = 'Support Me';
        links[7].innerText = '📧 About Me';
        document.getElementById('footer-text').innerText = '© 2026 Created by XH-ANM | All rights reserved';

        container.innerHTML = `
          <p>Name: User</p>
          <p>Support Email: <a href="mailto:xhanmceo@gmail.com">xhanmceo@gmail.com</a></p>
          <p>Founder of XH with over 215 active projects.</p>
        `;
      } else {
        document.body.classList.remove("english");
        document.body.style.direction = 'rtl';
        btnFa.classList.add('active');
        btnEn.classList.remove('active');
        
        links[0].innerText = 'مدیا پلیر 2';
        links[1].innerText = 'ماشین حساب';
        links[2].innerText = 'بازی بازی';
        links[3].innerText = 'سیگنال';
        links[4].innerText = 'ایکس اچ او اس 2027';
        links[5].innerText = 'گیت گیمز';
        links[6].innerText = 'حمایت از من';
        links[7].innerText = '📧 درباره من';
        document.getElementById('footer-text').innerText = '© 2026 ساخته شده توسط XH-ANM | تمام حقوق محفوظ است';

        container.innerHTML = `
          <p>نام: User</p>
          <p>ایمیل پشتیبانی: <a href="mailto:xhanmceo@gmail.com">xhanmceo@gmail.com</a></p>
          <p>مدیر برند XH با بیش از ۲۱۵ پروژه فعال.</p>
        `;
      }
    }
  </script>
</body>
</html>
