<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست انیمیشن‌های XH OS</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: auto;
        }
        
        .test-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .test-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            min-width: 200px;
            text-align: center;
        }
        
        .test-title {
            margin-bottom: 15px;
            font-size: 16px;
            color: #0066FF;
        }
        
        /* تست انیمیشن‌ها */
        .bounce { animation: logoBounce 2s ease-in-out infinite; }
        .glow { animation: logoGlow 3s ease-in-out infinite; }
        .pulse { animation: pulse 2s ease-in-out infinite; }
        .float { animation: float 3s ease-in-out infinite; }
        .rotate { animation: rotate 3s linear infinite; }
        .fadeIn { animation: fadeInUp 1s ease-out; }
        .bounceIn { animation: bounceIn 0.6s ease-out; }
        .ripple-test { 
            width: 60px; 
            height: 60px; 
            background: #0066FF; 
            border-radius: 50%; 
            margin: 0 auto; 
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .demo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #0066FF, #8B5CF6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 24px;
        }
        
        @keyframes logoBounce {
            0%, 100% { 
                transform: translateY(0px) scale(1); 
                filter: drop-shadow(0 0 10px rgba(0, 102, 255, 0.5));
            }
            50% { 
                transform: translateY(-15px) scale(1.05); 
                filter: drop-shadow(0 0 25px rgba(139, 92, 246, 0.8));
            }
        }
        
        @keyframes logoGlow {
            0%, 100% { 
                filter: drop-shadow(0 0 10px rgba(0, 102, 255, 0.6)) brightness(1);
            }
            50% { 
                filter: drop-shadow(0 0 25px rgba(139, 92, 246, 0.9)) brightness(1.2);
            }
        }
        
        @keyframes pulse {
            0%, 100% { 
                transform: scale(1);
                opacity: 1;
            }
            50% { 
                transform: scale(1.05);
                opacity: 0.8;
            }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes ripple {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; margin-bottom: 40px; color: #0066FF;">تست انیمیشن‌های XH OS Enhanced</h1>
    
    <div class="test-container">
        <div class="test-item">
            <div class="test-title">Logo Bounce</div>
            <div class="demo-icon bounce">📱</div>
        </div>
        
        <div class="test-item">
            <div class="test-title">Logo Glow</div>
            <div class="demo-icon glow">✨</div>
        </div>
        
        <div class="test-item">
            <div class="test-title">Pulse</div>
            <div class="demo-icon pulse">💓</div>
        </div>
        
        <div class="test-item">
            <div class="test-title">Float</div>
            <div class="demo-icon float">🎈</div>
        </div>
        
        <div class="test-item">
            <div class="test-title">Rotate</div>
            <div class="demo-icon rotate">🔄</div>
        </div>
        
        <div class="test-item">
            <div class="test-title">Fade In Up</div>
            <div class="demo-icon fadeIn">⬆️</div>
        </div>
        
        <div class="test-item">
            <div class="test-title">Bounce In</div>
            <div class="demo-icon bounceIn">🎯</div>
        </div>
        
        <div class="test-item">
            <div class="test-title">Ripple Effect (کلیک کنید)</div>
            <div class="ripple-test" onclick="createRipple(this, event)">💧</div>
        </div>
    </div>
    
    <script>
        function createRipple(element, event) {
            const ripple = document.createElement('div');
            const rect = element.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = event.clientX - rect.left - size / 2;
            const y = event.clientY - rect.top - size / 2;
            
            ripple.style.cssText = `
                position: absolute;
                width: ${size}px;
                height: ${size}px;
                left: ${x}px;
                top: ${y}px;
                background: rgba(255, 255, 255, 0.6);
                border-radius: 50%;
                transform: scale(0);
                animation: ripple 0.6s ease-out;
                pointer-events: none;
            `;
            
            element.style.position = 'relative';
            element.style.overflow = 'hidden';
            element.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 600);
        }
        
        // اضافه کردن انیمیشن fadeIn به همه عناصر
        setTimeout(() => {
            document.querySelectorAll('.test-item').forEach((item, index) => {
                setTimeout(() => {
                    item.style.opacity = '1';
                    item.style.transform = 'translateY(0)';
                }, index * 100);
            });
        }, 500);
    </script>
</body>
</html>
