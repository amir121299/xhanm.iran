<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal by XH - مبدل کد مورس</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-background">
        <div class="container">
            <!-- Header -->
            <header class="header">
                <h1 class="hero-title">📡 Signal-XH-ANM</h1>
                <p class="hero-subtitle">مبدل کد مورس مدرن</p>
            </header>

            <!-- Language Toggle -->
            <div class="language-toggle">
                <div class="toggle-container">
                    <button class="toggle-btn active" data-lang="fa">فارسی</button>
                    <button class="toggle-btn" data-lang="en">English</button>
                </div>
            </div>

            <!-- Main Converter -->
            <main class="converter-section">
                <div class="converter-card">
                    <!-- Input -->
                    <div class="input-section">
                        <label id="input-label" class="input-label">متن خود را وارد کنید</label>
                        <textarea id="input-text" class="input-field" placeholder="اینجا تایپ کنید..." dir="rtl"></textarea>
                    </div>

                    <!-- Control Bar -->
                    <div class="control-bar">
                        <div class="control-buttons">
                            <button id="play-btn" class="control-btn play-btn" title="پخش صدا">
                                <svg class="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                                <svg class="stop-icon hidden" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M6 6h12v12H6z"/>
                                </svg>
                            </button>
                            <button id="copy-btn" class="control-btn" title="کپی">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                                </svg>
                            </button>
                            <button id="swap-btn" class="control-btn" title="تغییر جهت">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M7 7h11l-3.5-3.5L16.5 2 23 8.5 16.5 15l-1.5-1.5L18 10H7V7zM17 17H6l3.5 3.5L7.5 22 1 15.5 7.5 9l1.5 1.5L6 14h11v3z"/>
                                </svg>
                            </button>
                            <button id="clear-btn" class="control-btn" title="پاک کردن">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Output -->
                    <div class="output-section">
                        <label id="output-label" class="output-label">کد مورس</label>
                        <textarea id="output-text" class="output-field" placeholder="..." dir="ltr" readonly></textarea>
                    </div>
                </div>
            </main>

            <!-- Reference Table -->
            <section class="reference-section">
                <h2 class="section-title">جدول مرجع کد مورس</h2>
                <div id="reference-grid" class="reference-grid"></div>
            </section>

            <!-- Footer -->
            <footer class="footer">
                <p class="footer-text">by XH-anm</p>
            </footer>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
